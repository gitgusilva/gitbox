name: Bug report
description: Something in GitBox does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        Do not use this form for security problems. Report those privately
        through [Security Advisories](https://github.com/gitgusilva/gitbox/security/advisories/new),
        as described in [SECURITY.md](https://github.com/gitgusilva/gitbox/blob/main/SECURITY.md).

  - type: checkboxes
    id: checks
    attributes:
      label: Before reporting
      options:
        - label: I searched the existing issues and this is not a duplicate
          required: true
        - label: I reproduced this on the latest release
          required: true

  - type: input
    id: version
    attributes:
      label: GitBox version
      description: Shown in Settings, under About.
      placeholder: "1.2.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Distribution and version
      placeholder: "Fedora 44, Ubuntu 24.04, Windows 11"
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: How you installed it
      options:
        - AppImage
        - deb
        - rpm
        - pacman
        - Windows installer (exe)
        - Windows installer (msi)
        - Built from source
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        If the repository matters, say what is special about it: its size, a
        submodule, a detached HEAD, a merge in progress, an SSH remote.
      placeholder: |
        1. Open a repository with ...
        2. Click ...
        3. The panel shows ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: |
        From `~/.config/GitBox/logs/gitbox-main.log` on Linux, or
        `%APPDATA%\GitBox\logs\gitbox-main.log` on Windows. Paste the lines
        around the failure. The log contains repository paths and remote URLs,
        so remove anything you would rather not publish.
      render: shell
